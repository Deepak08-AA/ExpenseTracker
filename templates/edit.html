<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Record</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='action.css') }}">
</head>
<body>

<div class="formbox">

    <h2>Update Record</h2>

    <form method="POST">

        <label>Amount</label><br>
        <input type="number" name="amount" value="{{ expense['amount'] }}" required>
        <br><br>

        <label>Category</label><br>
        <input type="text" name="category" value="{{ expense['category'] }}" required>
        <br><br>

        <label>Payment Method</label><br>

        <select name="payment_method">

            <option value="Cash"
                {% if expense['payment_method'] == "Cash" %}selected{% endif %}>
                Cash
            </option>

            <option value="UPI"
                {% if expense['payment_method'] == "UPI" %}selected{% endif %}>
                UPI
            </option>

            <option value="Bank"
                {% if expense['payment_method'] == "Bank" %}selected{% endif %}>
                Bank
            </option>

            <option value="Other"
                {% if expense['payment_method'] == "Other" %}selected{% endif %}>
                Other
            </option>

        </select>

        <br><br>

        <label>Date</label><br>

        <input
            type="date"
            name="date"
            value="{{ expense['date'] }}"
            required
        >

        <br><br>

        <button type="submit">Update Record</button>

    </form>

    <br>

    <a href="/home">Back to Home</a>

</div>

</body>
</html>
